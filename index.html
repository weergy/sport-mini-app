<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спорт Статистика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h1, h2 { margin: 0 0 8px 0; font-size: 20px; }
        .card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .card:active { transform: scale(0.98); }
        .back-btn {
            background: none; border: none; color: var(--button-color);
            font-size: 16px; padding: 0; margin-bottom: 16px; cursor: pointer;
        }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid rgba(128, 128, 128, 0.2); }
        th { font-weight: 600; color: rgba(128, 128, 128, 1); }
        tr:active { background-color: rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Главное меню -->
    <div id="main-menu">
        <h1>Меню</h1>
        <div class="card" onclick="showLeagues()">
            <h2>🏆 Чемпионаты</h2>
            <p>Выбрать лигу и посмотреть матчи</p>
        </div>
    </div>

    <!-- Список лиг -->
    <div id="leagues-menu" class="hidden">
        <button class="back-btn" onclick="showMainMenu()">← Назад</button>
        <h1>Выберите лигу</h1>
        <div class="card" onclick="showLeagueDetails('PL', 'Английская Премьер-лига')"><h2>🏴 АПЛ</h2></div>
        <div class="card" onclick="showLeagueDetails('PD', 'Ла Лига')"><h2>🇪🇸 Ла Лига</h2></div>
        <div class="card" onclick="showLeagueDetails('SA', 'Серия А')"><h2>🇮🇹 Серия А</h2></div>
        <div class="card" onclick="showLeagueDetails('BL1', 'Бундеслига')"><h2>🇩🇪 Бундеслига</h2></div>
        <div class="card" onclick="showLeagueDetails('FL1', 'Лига 1')"><h2>🇫🇷 Лига 1</h2></div>
        <div class="card" onclick="showLeagueDetails('CL', 'Лига Чемпионов')"><h2>🏆 Лига Чемпионов</h2></div>
    </div>

    <!-- Детали лиги -->
    <div id="league-details" class="hidden">
        <button class="back-btn" onclick="showLeagues()">← Назад к лигам</button>
        <h1 id="league-title">Лига</h1>
        <div class="card" onclick="showTable()">
            <h2>📊 Турнирная таблица</h2>
            <p>Посмотреть текущее положение команд</p>
        </div>
    </div>

    <!-- Таблица -->
    <div id="table-view" class="hidden">
        <button class="back-btn" onclick="backToDetails()">← Назад</button>
        <h1 id="table-title">Таблица</h1>
        <table id="league-table">
            <thead>
                <tr><th>#</th><th>Команда</th><th>И</th><th>О</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let currentLeagueCode = '';
        let currentLeagueName = '';

        function hideAll() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('leagues-menu').classList.add('hidden');
            document.getElementById('league-details').classList.add('hidden');
            document.getElementById('table-view').classList.add('hidden');
        }

        function showMainMenu() { hideAll(); document.getElementById('main-menu').classList.remove('hidden'); }
        function showLeagues() { hideAll(); document.getElementById('leagues-menu').classList.remove('hidden'); }
        
        function showLeagueDetails(code, name) {
            hideAll();
            currentLeagueCode = code;
            currentLeagueName = name;
            document.getElementById('league-title').innerText = name;
            document.getElementById('league-details').classList.remove('hidden');
        }

        function backToDetails() {
            showLeagueDetails(currentLeagueCode, currentLeagueName);
        }

        async function showTable() {
            hideAll();
            document.getElementById('table-view').classList.remove('hidden');
            document.getElementById('table-title').innerText = 'Таблица: ' + currentLeagueName;
            
            const tbody = document.getElementById('league-table').querySelector('tbody');
            tbody.innerHTML = '<tr><td colspan="4">Загрузка...</td></tr>';

            try {
                // Твоя ссылка из туннеля Cloudflare
                const apiUrl = 'https://improved-programme-kid-buffer.trycloudflare.com';
                const response = await fetch(`${apiUrl}/api/table/${currentLeagueCode}`);
                const data = await response.json();

                if (data.error) {
                    tbody.innerHTML = `<tr><td colspan="4">Ошибка: ${data.error}</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.table.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.position}</td>
                        <td>${row.team}</td>
                        <td>${row.played}</td>
                        <td>${row.points}</td>
                    `;
                    tr.onclick = () => alert(`Команда: ${row.team}\nОчки: ${row.points}\nЗабито: ${row.goalsFor}\nПропущено: ${row.goalsAgainst}`);
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="4">Ошибка сети: ${e.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
